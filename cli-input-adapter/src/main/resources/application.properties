#Logging config (solo advertencias en consola para no ensuciar el menu; el detalle va al archivo)
logging.level.root=INFO
logging.threshold.console=WARN
logging.file.name=logs/persona-cli.log
#CLI: sin banner y sin servidor web
spring.main.banner-mode=off
spring.main.web-application-type=none
#MariaDB Config
spring.datasource.url=jdbc:mariadb://localhost:3307/persona_db
spring.datasource.username=persona_db
spring.datasource.password=persona_db
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
#MongoDB Config (Spring Boot 4 cambio el prefijo spring.data.mongodb.* por spring.mongodb.*)
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=persona_db
spring.mongodb.username=persona_db
spring.mongodb.password=persona_db
spring.mongodb.authentication-database=admin
