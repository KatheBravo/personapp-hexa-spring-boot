# Integracion continua de PersonApp
#  1. build:       compila los 7 modulos con JDK 21 y ejecuta las pruebas unitarias.
#  2. integracion: levanta MariaDB y MongoDB con docker compose (que ejecuta los
#                  scripts DDL y DML), arranca la API REST y la CLI y prueba el
#                  CRUD completo en ambos motores. Guarda evidencias de la ejecucion.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Versiones
        run: |
          java -version
          mvn -v
      - name: Compilar y ejecutar pruebas unitarias
        run: mvn -B -ntp clean verify
      - name: Resumen de pruebas unitarias
        if: always()
        run: |
          {
            echo "## Pruebas unitarias"
            echo
            echo "| Modulo | Pruebas | Fallas | Errores |"
            echo "|---|---|---|---|"
            for f in $(find . -path '*/surefire-reports/TEST-*.xml' | sort); do
              mod=$(echo "$f" | cut -d/ -f2)
              cls=$(basename "$f" .xml | sed 's/^TEST-//; s/.*\.//')
              t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              er=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              echo "| $mod / $cls | $t | $fl | $er |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar los JAR ejecutables
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            rest-input-adapter/target/rest-input-adapter-*.jar
            cli-input-adapter/target/cli-input-adapter-*.jar
          retention-days: 7

  integracion:
    name: Pruebas de integracion (MariaDB y MongoDB)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Descargar los JAR
        uses: actions/download-artifact@v4
        with:
          name: jars
      - name: Levantar MariaDB y MongoDB (ejecuta los scripts DDL y DML)
        run: |
          docker compose version
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
      - name: Verificar los datos cargados por los scripts
        run: |
          echo "MariaDB (usuario de la aplicacion persona_db):"
          docker exec personapp-mariadb mariadb -upersona_db -ppersona_db persona_db -e "SELECT 'persona' AS tabla, COUNT(*) AS filas FROM persona UNION ALL SELECT 'profesion', COUNT(*) FROM profesion UNION ALL SELECT 'telefono', COUNT(*) FROM telefono UNION ALL SELECT 'estudios', COUNT(*) FROM estudios;"
          echo "MongoDB (usuario de la aplicacion persona_db):"
          docker exec personapp-mongodb mongosh --quiet -u persona_db -p persona_db --authenticationDatabase admin persona_db --eval 'printjson({persona: db.persona.countDocuments(), profesion: db.profesion.countDocuments(), telefono: db.telefono.countDocuments(), estudios: db.estudios.countDocuments(), colecciones: db.getCollectionNames().sort()})'
      - name: Arrancar la API REST
        run: |
          nohup java -jar rest-input-adapter/target/rest-input-adapter-1.0.0.jar > rest-console.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api-docs > /dev/null; then echo "API arriba en ${i}s"; exit 0; fi
            sleep 1
          done
          echo "La API no arranco"; cat rest-console.log; exit 1
      - name: Prueba de integracion REST (ambos motores, sin reiniciar)
        run: bash scripts/prueba-integracion.sh http://localhost:3000
      - name: Capturas de Swagger UI
        if: always()
        run: |
          mkdir -p evidencias
          curl -s http://localhost:3000/api-docs | jq . > evidencias/openapi.json || true
          for tam in 1400,1000 1400,3200; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=$tam --virtual-time-budget=15000 \
              --screenshot=evidencias/swagger-ui-${tam%,*}x${tam#*,}.png \
              http://localhost:3000/swagger-ui/index.html || true
          done
          ls -la evidencias
      - name: Detener la API REST
        if: always()
        run: pkill -f rest-input-adapter || true
      - name: Prueba de la CLI
        if: success() || failure()
        run: |
          mkdir -p evidencias
          SALIDA_CLI=evidencias/salida-cli.txt bash scripts/prueba-cli.sh cli-input-adapter/target/cli-input-adapter-1.0.0.jar
      - name: Mostrar la sesion de la CLI
        if: always()
        run: cat evidencias/salida-cli.txt || true
      - name: Registros de las aplicaciones y de las bases
        if: always()
        run: |
          cp rest-console.log evidencias/ 2>/dev/null || true
          cp logs/*.log evidencias/ 2>/dev/null || true
          docker compose logs --no-color > evidencias/docker-compose.log 2>&1 || true
          tail -n 60 rest-console.log || true
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: evidencias
          retention-days: 30
