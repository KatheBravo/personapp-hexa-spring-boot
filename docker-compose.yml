# Stack completo de PersonApp en contenedores:
#   docker compose up -d --build             -> levanta MariaDB, MongoDB y la API REST (puerto 3000)
#   docker compose run --rm personapp-cli    -> ejecuta el menu interactivo CLI contra las mismas bases
#   docker compose down -v                   -> detiene y elimina contenedores y volumenes
# La primera vez MariaDB y MongoDB ejecutan los scripts DDL y DML de la carpeta scripts/.
services:
  mariadb:
    image: mariadb:11.8
    container_name: personapp-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./scripts/persona_ddl_maria.sql:/docker-entrypoint-initdb.d/01_persona_ddl_maria.sql:ro
      - ./scripts/persona_dml_maria.sql:/docker-entrypoint-initdb.d/02_persona_dml_maria.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    # MongoDB 7.0: las imagenes 8.x se niegan a arrancar con kernels Linux 6.19 a 7.0.13
    # (incompatibilidad con TCMalloc, SERVER-121912), que es el kernel de GitHub Actions.
    image: mongo:7.0
    container_name: personapp-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./scripts/persona_ddl_mongo.js:/docker-entrypoint-initdb.d/01_persona_ddl_mongo.js:ro
      - ./scripts/persona_dml_mongo.js:/docker-entrypoint-initdb.d/02_persona_dml_mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  personapp-rest:
    build:
      context: .
      target: rest
    container_name: personapp-rest
    ports:
      - "3000:3000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/persona_db
      SPRING_DATASOURCE_USERNAME: persona_db
      SPRING_DATASOURCE_PASSWORD: persona_db
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: 27017
      SPRING_MONGODB_DATABASE: persona_db
      SPRING_MONGODB_USERNAME: persona_db
      SPRING_MONGODB_PASSWORD: persona_db
      SPRING_MONGODB_AUTHENTICATION_DATABASE: admin
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  personapp-cli:
    build:
      context: .
      target: cli
    container_name: personapp-cli
    profiles: ["cli"]
    stdin_open: true
    tty: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/persona_db
      SPRING_DATASOURCE_USERNAME: persona_db
      SPRING_DATASOURCE_PASSWORD: persona_db
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: 27017
      SPRING_MONGODB_DATABASE: persona_db
      SPRING_MONGODB_USERNAME: persona_db
      SPRING_MONGODB_PASSWORD: persona_db
      SPRING_MONGODB_AUTHENTICATION_DATABASE: admin
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  mariadb-data:
  mongodb-data:
