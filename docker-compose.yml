# Bases de datos de PersonApp para desarrollo local.
#   docker compose up -d      -> crea MariaDB (puerto 3307) y MongoDB (puerto 27017)
#   docker compose down -v    -> las borra (incluidos los datos)
# La primera vez cada contenedor ejecuta los scripts DDL y DML de la carpeta scripts/.
services:
  mariadb:
    image: mariadb:11.8
    container_name: personapp-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./scripts/persona_ddl_maria.sql:/docker-entrypoint-initdb.d/01_persona_ddl_maria.sql:ro
      - ./scripts/persona_dml_maria.sql:/docker-entrypoint-initdb.d/02_persona_dml_maria.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    # MongoDB 7.0: las imagenes 8.x se niegan a arrancar con kernels Linux 6.19 a 7.0.13
    # (incompatibilidad con TCMalloc, SERVER-121912), que es el kernel de GitHub Actions.
    image: mongo:7.0
    container_name: personapp-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./scripts/persona_ddl_mongo.js:/docker-entrypoint-initdb.d/01_persona_ddl_mongo.js:ro
      - ./scripts/persona_dml_mongo.js:/docker-entrypoint-initdb.d/02_persona_dml_mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
  mongodb-data:
